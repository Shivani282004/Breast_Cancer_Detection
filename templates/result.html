<!DOCTYPE html>
<html lang="en">
<head>
  <title>Breast Cancer Prediction</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .result-card {
      background-color: #f5f5f5;
      padding: 30px;
      border-radius: 8px;
      margin: 30px 0;
    }
    .result-card h1 {
      font-size: 28px;
      color: #333;
      margin: 0 0 15px 0;
    }
    .result-card p {
      font-size: 18px;
      color: #555;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  {% include "footer.html" %}

  <div class="container">
    <div class="result-card">
      <h1>Cancer is Predicted to be {{ output }}</h1>
      <p>The Probability of {{ output }} is {{ '%.9f'|format(accuracy * 100) }}%.</p>
      <p>The time taken to predict is {{ '%.9f'|format(time) }} seconds.</p>
    </div>

    {% include "tumor.html" %}
  </div>
</body>
</html>
